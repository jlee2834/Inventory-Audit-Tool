services:
  inventory:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - audit_data:/data
    ports:
      - "${BIND_IP:-127.0.0.1}:8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  audit_data:
